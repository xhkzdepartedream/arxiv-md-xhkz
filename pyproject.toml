[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-md-xhkz"
version = "0.1.1"
description = "Convert arXiv TeX sources to Markdown (community fork with transcription-quality fixes)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mauro Sciancalepore", email = "maurosciancalepore98@gmail.com" },
    { name = "xhkzdepartedream" },
]
keywords = ["arxiv", "latex", "markdown", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
assets = [
    "pillow>=10.0.0",
    "pypdfium2>=4.30.0",
]

[project.urls]
Repository = "https://github.com/xhkzdepartedream/arxiv-md-xhkz"
Homepage = "https://github.com/xhkzdepartedream/arxiv-md-xhkz"

[project.scripts]
arxiv-to-md = "arxiv_md.arxiv_to_md:main"
tex-ast = "arxiv_md.tex.dump_ast:main"
tex-to-md = "arxiv_md.tex.convert:main"

[tool.setuptools.packages.find]
include = ["arxiv_md*"]
